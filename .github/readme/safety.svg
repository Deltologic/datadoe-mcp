<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img">
<style>
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1" y="1" width="1198" height="268" rx="16" fill="#071a18" stroke="#00ffdd" stroke-opacity=".3"/>
<text x="24" y="32" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="3" fill="#00ffdd" fill-opacity=".8">HOW A SAFE WRITE RUNS</text>
<line x1="120" y1="104" x2="1080" y2="104" stroke="#00ffdd" stroke-opacity=".25" stroke-width="2"/>
<line x1="120" y1="104" x2="1080" y2="104" stroke="#00ffdd" stroke-opacity=".6" stroke-width="2" stroke-dasharray="3 14"><animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite"/></line>
<circle cx="120" cy="104" r="6" fill="#ffffff" filter="url(#glow)"><animate attributeName="cx" values="120;1080;1080" keyTimes="0;.8;1" dur="7.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.82;1" dur="7.0s" repeatCount="indefinite"/></circle>
<circle cx="120" cy="104" r="34" fill="#00ffdd" fill-opacity=".08"><animate attributeName="fill-opacity" values=".08;.08;.9;.25;.08" keyTimes="0;0.000;0.001;0.120;1" dur="7.0s" repeatCount="indefinite"/></circle><circle cx="120" cy="104" r="34" fill="none" stroke="#00ffdd" stroke-width="2"/><text x="120" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="800" fill="#ffffff">01</text><text x="120" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Turned on</text><text x="120" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#00ffdd" style="white-space:pre">Settings  ›  Actions</text><text x="120" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity=".7">off until you enable it</text>
<circle cx="360" cy="104" r="34" fill="#00ffdd" fill-opacity=".08"><animate attributeName="fill-opacity" values=".08;.08;.9;.25;.08" keyTimes="0;0.199;0.201;0.320;1" dur="7.0s" repeatCount="indefinite"/></circle><circle cx="360" cy="104" r="34" fill="none" stroke="#00ffdd" stroke-width="2"/><text x="360" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="800" fill="#ffffff">02</text><text x="360" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Dry run</text><text x="360" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#00ffdd" style="white-space:pre">dryRun: true</text><text x="360" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity=".7">checks, sends nothing</text>
<circle cx="600" cy="104" r="34" fill="#00ffdd" fill-opacity=".08"><animate attributeName="fill-opacity" values=".08;.08;.9;.25;.08" keyTimes="0;0.399;0.401;0.520;1" dur="7.0s" repeatCount="indefinite"/></circle><circle cx="600" cy="104" r="34" fill="none" stroke="#00ffdd" stroke-width="2" stroke-dasharray="5 5"/><text x="600" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="800" fill="#ffffff">03</text><text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Amazon preview</text><text x="600" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#00ffdd" style="white-space:pre">_VERIFY  _VALIDATE  _PREVIEW</text><text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity=".7">listings, A+ and MCF</text>
<circle cx="840" cy="104" r="34" fill="#00ffdd" fill-opacity=".08"><animate attributeName="fill-opacity" values=".08;.08;.9;.25;.08" keyTimes="0;0.599;0.601;0.720;1" dur="7.0s" repeatCount="indefinite"/></circle><circle cx="840" cy="104" r="34" fill="none" stroke="#00ffdd" stroke-width="2"/><text x="840" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="800" fill="#ffffff">04</text><text x="840" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Run</text><text x="840" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#00ffdd" style="white-space:pre">actions_start</text><text x="840" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity=".7">sends it to Amazon</text>
<circle cx="1080" cy="104" r="34" fill="#00ffdd" fill-opacity=".08"><animate attributeName="fill-opacity" values=".08;.08;.9;.25;.08" keyTimes="0;0.799;0.801;0.920;1" dur="7.0s" repeatCount="indefinite"/></circle><circle cx="1080" cy="104" r="34" fill="none" stroke="#00ffdd" stroke-width="2"/><text x="1080" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="800" fill="#ffffff">05</text><text x="1080" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Logged</text><text x="1080" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#00ffdd" style="white-space:pre">actions_list</text><text x="1080" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity=".7">every Action recorded</text>
</svg>
